# Production profile: Neon (or any) PostgreSQL.
# The datasource comes from environment variables, e.g. on Render:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<neon-host>/<db>?sslmode=require
#   SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD (or embed them in the URL)
spring.datasource.driverClassName=org.postgresql.Driver

# Run data-postgresql.sql instead of data-h2.sql
spring.sql.init.data-locations=classpath:data-postgresql.sql

# No H2 console in production
spring.h2.console.enabled=false
