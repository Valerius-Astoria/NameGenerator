spring.application.name=NameGenerator

# Bind to the platform-provided port when deployed (Render injects PORT)
server.port=${PORT:8080}

# H2 file database (./data/) so accounts and generation history survive restarts
spring.datasource.url=jdbc:h2:file:./data/namegenerator
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Evolve schema in place, then run the platform seed script (idempotent statements):
# data-h2.sql by default, data-postgresql.sql under the postgres profile
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.platform=h2

# Gemini (set GOOGLE_API_KEY in the environment, or override gemini.api-key)
gemini.api-key=${GOOGLE_API_KEY:}
gemini.model=gemini-3.5-flash
