<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NameGenerator — Not found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<main class="page page-narrow">
    <header class="site-header">
        <div>
            <p class="step">
                <span class="step-dot"></span>
                <th:block th:text="${status} ?: 'Error'">404</th:block>
            </p>
            <h1 class="brand">Name<span>Generator</span></h1>
        </div>
        <p class="lede">This dossier is not in the archive.</p>
    </header>

    <p class="fleuron" aria-hidden="true">❦</p>

    <section class="panel auth-panel">
        <p class="result-annotation" style="font-style: normal;">
            The page you asked for is missing, restricted, or no longer filed.
            Return to a dossier or consult the archive.
        </p>
        <div class="actions" style="margin-top:1.25rem;">
            <a class="btn btn-primary" th:href="@{/design}">New dossier</a>
            <a class="btn btn-secondary" th:href="@{/history}">Archive</a>
            <a class="btn btn-secondary" th:href="@{/login}">Sign in</a>
        </div>
    </section>
</main>
</body>
</html>
