<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NameGenerator — Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<main class="page page-narrow">
    <header class="site-header">
        <div>
            <p class="step"><span class="step-dot"></span> Reading room</p>
            <h1 class="brand">Name<span>Generator</span></h1>
        </div>
        <p class="lede">Register with your email to keep an archive of every name you file.</p>
    </header>

    <p class="fleuron" aria-hidden="true">❦</p>

    <section class="panel auth-panel">
        <form method="post" th:action="@{/register}" th:object="${registrationForm}" class="form-grid">
            <div>
                <label class="field-label" for="email">Email</label>
                <input id="email" type="email" th:field="*{email}"
                       autocomplete="email" required autofocus>
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">error</p>
            </div>
            <div>
                <label class="field-label" for="regPassword">Password</label>
                <input id="regPassword" type="password" th:field="*{password}"
                       autocomplete="new-password" required>
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">error</p>
            </div>
            <div>
                <label class="field-label" for="confirmPassword">Repeat password</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}"
                       autocomplete="new-password" required>
                <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">error</p>
            </div>
            <div class="actions">
                <button class="btn btn-primary" type="submit">Create account</button>
                <a class="btn btn-secondary" th:href="@{/login}">Back to sign in</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
